<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap');
  :root { --ink:#2c3b4d; --on:#e8892b; --off:#d8d2c4; --muted:rgba(44,59,77,.6); }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Geist Mono',ui-monospace,monospace; color:var(--ink); }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:18px; padding:40px 16px 28px; }
  svg { width:100%; max-width:520px; height:auto; overflow:visible; }
  .wire { stroke:var(--off); stroke-width:3; stroke-linecap:round; transition:stroke .18s ease-out; }
  .glow { stroke:rgba(232,137,43,0); stroke-width:10; stroke-linecap:round; transition:stroke .18s ease-out; }
  .on .wire { stroke:var(--on); } .on .glow { stroke:rgba(232,137,43,.22); }
  .pulse { stroke:#fff1e0; stroke-width:3; stroke-linecap:round; stroke-dasharray:10 160; opacity:0; }
  .on .pulse { opacity:1; animation:flow 1.1s linear infinite; }
  @keyframes flow { from { stroke-dashoffset:170 } to { stroke-dashoffset:0 } }
  .toggle { cursor:pointer; }
  .toggle rect { fill:#e3dccd; transition:fill .2s ease-out; }
  .toggle circle { fill:#fff; transition:transform .24s cubic-bezier(.34,1.56,.64,1); filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.18)); }
  .toggle.on rect { fill:var(--ink); } .toggle.on circle { transform:translateX(24px); }
  .toggle:active circle { r:12.5; }
  .toggle:focus-visible { outline:none; } .toggle:focus-visible rect { stroke:#a35139; stroke-width:2; }
  .lamp { fill:#fff; stroke:var(--off); stroke-width:2.5; transition:fill .18s ease-out, stroke .18s; }
  .halo { fill:rgba(232,137,43,0); transition:fill .3s ease-out, transform .3s cubic-bezier(.34,1.56,.64,1); transform-origin:462px 100px; transform:scale(.6); }
  .lit .lamp { fill:var(--on); stroke:var(--on); } .lit .halo { fill:rgba(232,137,43,.14); transform:scale(1); }
  .readout { display:flex; align-items:center; gap:10px; padding:8px 14px; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 1px rgba(201,193,177,.6); font-size:13px; }
  .readout .m { color:var(--muted); } .readout b { transition:color .18s; } .readout b.hot { color:var(--on); }
  .hint { font-size:12px; color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition-duration:1ms !important; animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 520 200" role="img" aria-label="Porta lógica AND com entradas A e B">
    <text x="0" y="61" font-size="14" font-weight="600" fill="#2c3b4d">A</text>
    <g class="toggle on" id="tA" tabindex="0" role="switch" aria-checked="true" aria-label="Entrada A"><rect x="20" y="40" width="54" height="30" rx="15"/><circle cx="35" cy="55" r="11"/></g>
    <text x="0" y="151" font-size="14" font-weight="600" fill="#2c3b4d">B</text>
    <g class="toggle" id="tB" tabindex="0" role="switch" aria-checked="false" aria-label="Entrada B"><rect x="20" y="130" width="54" height="30" rx="15"/><circle cx="35" cy="145" r="11"/></g>
    <g id="wA" class="on"><path class="glow" d="M84 55H220"/><path class="wire" d="M84 55H220"/><path class="pulse" d="M84 55H220"/></g>
    <g id="wB"><path class="glow" d="M84 145H220"/><path class="wire" d="M84 145H220"/><path class="pulse" d="M84 145H220"/></g>
    <path d="M220 30H270A70 70 0 0 1 270 170H220Z" fill="#fff" stroke="#2c3b4d" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="246" y="105" font-size="13" font-weight="600" fill="#2c3b4d">AND</text>
    <g id="wS"><path class="glow" d="M340 100H432"/><path class="wire" d="M340 100H432"/><path class="pulse" d="M340 100H432"/></g>
    <g id="lamp"><circle class="halo" cx="462" cy="100" r="34"/><circle class="lamp" cx="462" cy="100" r="24"/></g>
  </svg>
  <div class="readout" aria-live="polite"><b id="ra">1</b><span class="m">AND</span><b id="rb">0</b><span class="m">=</span><b id="rs">0</b><span class="m" id="msg">falta ligar o B</span></div>
  <span class="hint">Clique em A e B (ou use Tab + Espaço).</span>
</div>
<script>
  const state = { a: 1, b: 0 };
  const $ = (id) => document.getElementById(id);
  let timer;
  function render() {
    $('tA').classList.toggle('on', !!state.a); $('tA').setAttribute('aria-checked', !!state.a);
    $('tB').classList.toggle('on', !!state.b); $('tB').setAttribute('aria-checked', !!state.b);
    $('wA').classList.toggle('on', !!state.a);
    $('wB').classList.toggle('on', !!state.b);
    const out = state.a && state.b ? 1 : 0;
    $('ra').textContent = state.a; $('rb').textContent = state.b;
    clearTimeout(timer);
    // O sinal precisa chegar na porta antes da lâmpada reagir: causa → efeito.
    timer = setTimeout(() => {
      $('wS').classList.toggle('on', !!out);
      setTimeout(() => $('lamp').classList.toggle('lit', !!out), out ? 120 : 0);
      $('rs').textContent = out; $('rs').classList.toggle('hot', !!out);
      $('msg').textContent = out ? 'a lâmpada acende' : !state.a && !state.b ? 'as duas estão desligadas' : !state.a ? 'falta ligar o A' : 'falta ligar o B';
    }, 240);
  }
  for (const [id, key] of [['tA','a'],['tB','b']]) {
    const el = $(id);
    const flip = () => { state[key] ^= 1; render(); };
    el.addEventListener('click', flip);
    el.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
  }
  render();
</script>
</body>
</html>
